<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Travlr Getaways - Trip Administration</h2>
    <button class="btn btn-success" (click)="startAdd()" *ngIf="!isAdding && !editingTrip">Add New Trip</button>
  </div>

  <div class="card mb-4 p-3" *ngIf="isAdding || editingTrip">
    <h4>{{ isAdding ? 'Add New Trip' : 'Edit Trip' }}</h4>
    <form (ngSubmit)="saveTrip()">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label">Code</label>
          <input class="form-control" [(ngModel)]="formModel.code" name="code" [readonly]="!isAdding" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">Name</label>
          <input class="form-control" [(ngModel)]="formModel.name" name="name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Length</label>
          <input class="form-control" [(ngModel)]="formModel.length" name="length" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Start Date</label>
          <input type="date" class="form-control" [(ngModel)]="formModel.start" name="start" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Resort</label>
          <input class="form-control" [(ngModel)]="formModel.resort" name="resort" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Per Person Price</label>
          <input class="form-control" [(ngModel)]="formModel.perPerson" name="perPerson" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Image filename</label>
          <input class="form-control" [(ngModel)]="formModel.image" name="image" required>
        </div>
        <div class="col-md-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" [(ngModel)]="formModel.description" name="description" required></textarea>
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary me-2">Save</button>
        <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
      </div>
    </form>
  </div>

  <div *ngFor="let trip of trips">
    <app-trip-card [trip]="trip" (editTrip)="startEdit($event)" (deleteTrip)="onDeleteTrip($event)"></app-trip-card>
  </div>

  <p *ngIf="trips.length === 0" class="text-muted">No trips found.</p>
</div>
